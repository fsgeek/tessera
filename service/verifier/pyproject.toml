[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-verify"
version = "0.0.0"
description = "Tessera V1 service verifier (tessera-v1-strict)"
requires-python = "==3.14.*"
dependencies = ["cryptography==50.0.2"]

[project.scripts]
tessera-verify = "tessera_verify.cli:main"

[tool.setuptools]
packages = ["tessera_verify"]

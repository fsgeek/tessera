[project]
name = "tessera-prototype"
version = "0.0.0"
description = "THROWAWAY prototype. Not service code. May be deleted at any time."
requires-python = ">=3.14"
dependencies = [
    "cryptography>=43",
    "dnspython>=2.8.0",
    "opentimestamps>=0.4.5",
    "rfc8785>=0.1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

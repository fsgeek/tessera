\* P4 termination: <>(req # "active") under LiveSpec (WF poller steps, WF
\* write resolution, SF Tick) and the schedule assumption PollEachTick (the
\* poller starts at least once per time unit, the EventBridge rate). No
\* fairness on the environment: burial may never happen and every fetch may
\* fail forever. MaxTime = 11 leaves room for attempt 2's
\* EVIDENCE_UNAVAILABLE end; at MaxTime the poller can still act.
\* MaxFaults = 1 keeps the liveness graph tractable.
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 1
  MaxTime = 11
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = TRUE
  TrackGhosts = FALSE

SPECIFICATION LiveSpec

PROPERTIES
  Termination

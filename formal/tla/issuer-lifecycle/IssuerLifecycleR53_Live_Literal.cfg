\* As _Live_A0 but WindowMode "literal" (window ends AT the current interval,
\* committed failures only; R53-F1).
CONSTANTS
  N = 1
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 7
  MaxFaults = 0
  Variant = "correct"
  PollEachTick = TRUE
  MaxPollsPerTick = 1
  TrackGhosts = FALSE
  WindowMode = "literal"
  AllowKill = TRUE

SPECIFICATION LiveSpec

PROPERTIES
  Termination

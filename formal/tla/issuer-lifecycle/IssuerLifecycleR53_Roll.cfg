\* R5.3 ILC3-03 reachability: (1) rolling window, CORRECT model: an attempt whose
\* first fixed window had a gap still ends EVIDENCE_UNAVAILABLE (EndAfterGapUnreachable
\* VIOLATED = recovery reachable). One poll per tick, no faults, N = 1, MaxTime 6.
CONSTANTS
  N = 1
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 6
  MaxFaults = 0
  Variant = "correct"
  PollEachTick = FALSE
  MaxPollsPerTick = 1
  TrackGhosts = FALSE
  WindowMode = "completed"
  AllowKill = TRUE

INIT Init
NEXT Next

INVARIANTS
  EndAfterGapUnreachable

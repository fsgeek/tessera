\* R5 vacuity witnesses; run with run-witnesses-r5.sh (one TLC run per
\* witness, BFS, first violation). Every witness VIOLATED = healthy.
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 1
  MaxTime = 6
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  TrackGhosts = TRUE
  USReading = "fetch"

INIT Init
NEXT Next

INVARIANTS
  USSetUnreachable
  LatchAfterUSUnreachable
  UnavailThenShipUnreachable
  RefusalAfterUnavailUnreachable
  OrphanPendingUnreachable
  ExpiredUnreachable
  DiscardedUnreachable
  UnavailUnreachable
  ShipUnreachable
  RefusalUnreachable

\* R5 with unavailable_since taken at the DECISION (USReading = "send"), the
\* other reading of "the first poll after B". Otherwise IssuerLifecycleR5.cfg.
\* Result: RED on P5_UnavailablePeriod (see RESULTS.md, R5 finding R5-F1).
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 1
  MaxTime = 6
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  TrackGhosts = FALSE
  USReading = "send"

INIT Init
NEXT Next

INVARIANTS
  TypeOK
  NoTimelyExpiry
  NegativeEndsAreTrue
  ExpiryAfterB
  LatchIsTrue
  OneLive
  AllocatedPrefix
  PastAttemptsEnded
  CompleteIffShipped
  NoSilentEnd
  NeverBetweenAttempts
  RefusedOnlyWhenExhausted
  USAfterB
  P5_UnavailablePeriod

PROPERTIES
  EndedFrozen
  LatchProtects
  ShipFromLatch
  TerminalLatched

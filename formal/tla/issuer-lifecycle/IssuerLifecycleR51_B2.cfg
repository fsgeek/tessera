\* R5.1 companion B2: a second concurrent writer (with its own fence), same
\* procedure and guards. Expected GREEN. Reduced bounds so it finishes in minutes:
\* N = 1, MaxTime = 5, MaxFaults = 0 (two processes overlap directly).
CONSTANTS
  N = 1
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 5
  MaxFaults = 0
  Variant = "B2"
  PollEachTick = FALSE
  MaxPollsPerTick = 1
  TrackGhosts = FALSE

INIT Init
NEXT Next

INVARIANTS
  TypeOK
  NoTimelyExpiry
  NegativeEndsAreTrue
  ExpiryAfterB
  LatchIsTrue
  OneLive
  AllocatedPrefix
  PastAttemptsEnded
  CompleteIffShipped
  NoSilentEnd
  NeverBetweenAttempts
  RefusedOnlyWhenExhausted
  USAfterB
  P5_UnavailablePeriod
  P5_Spread

PROPERTIES
  EndedFrozen
  LatchProtects
  ShipFromLatch
  TerminalLatched

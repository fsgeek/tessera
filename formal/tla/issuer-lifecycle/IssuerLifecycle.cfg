\* Revision-4 main cfg. Expected GREEN on every invariant and property.
\* Run: java -cp tla2tools.jar tlc2.TLC -workers auto -deadlock -metadir $(mktemp -d)
\*        -config IssuerLifecycle.cfg IssuerLifecycle.tla
\* -deadlock: terminal states (shipped, refused, MaxTime) are bound artifacts.
\* Time unit: one tick. B = declared + 1 (only Delta + Slack enters the model); EVIDENCE_UNAVAILABLE needs now > B + 1;
\* writes resolve within 1 tick of their send; an invocation lives at most 1
\* tick. MaxTime = 7 lets attempt 2 reach its EVIDENCE_UNAVAILABLE end and the
\* refusal (checked by the _Sanity cfg, RefusalUnreachable).
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 1
  MaxTime = 7
  MaxFaults = 2
  Variant = "correct"
  PollEachTick = FALSE
  TrackGhosts = FALSE

INIT Init
NEXT Next

INVARIANTS
  TypeOK
  NoTimelyExpiry
  NegativeEndsAreTrue
  ExpiryAfterB
  LatchIsTrue
  OneLive
  AllocatedPrefix
  PastAttemptsEnded
  CompleteIffShipped
  NoSilentEnd
  NeverBetweenAttempts
  RefusedOnlyWhenExhausted

PROPERTIES
  EndedFrozen
  LatchProtects
  ShipFromLatch
  TerminalLatched

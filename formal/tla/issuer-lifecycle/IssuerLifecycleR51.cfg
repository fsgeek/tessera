\* Revision-5.1 main cfg. Expected GREEN on P1-P3, P5 and P5_Spread.
\* Bounds: N = 2, B = declared + 1, OpPeriod = 2, PollInterval = 1 so Expected
\* = 2 failed polls (Allowance 0); one poll per time unit (MaxPollsPerTick 1);
\* MaxFaults = 1; MaxTime = 6 (attempt 1 can end EVIDENCE_UNAVAILABLE at 4,
\* attempt 2 can then latch, ship, expire or be discarded).
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 6
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  MaxPollsPerTick = 1
  TrackGhosts = FALSE

INIT Init
NEXT Next

INVARIANTS
  TypeOK
  NoTimelyExpiry
  NegativeEndsAreTrue
  ExpiryAfterB
  LatchIsTrue
  OneLive
  AllocatedPrefix
  PastAttemptsEnded
  CompleteIffShipped
  NoSilentEnd
  NeverBetweenAttempts
  RefusedOnlyWhenExhausted
  USAfterB
  P5_UnavailablePeriod
  P5_Spread

PROPERTIES
  EndedFrozen
  LatchProtects
  ShipFromLatch
  TerminalLatched

\* Revision-5 main cfg. Expected GREEN on P1-P3 and P5 (P5_UnavailablePeriod).
\* Other constants as the revision-4 IssuerLifecycle.cfg. B = declared + 1.
\* MaxFaults = 1 and MaxTime = 6 (revision 4 used 2 and 7: at those bounds this
\* module passed 190M distinct states without finishing). MaxTime = 6 still
\* lets both attempts end EVIDENCE_UNAVAILABLE (attempt 1: first
\* failed poll at 2, end decided at 3; attempt 2 declared 3: 5 and 6) —
\* RefusalAfterUnavailUnreachable in the _Sanity cfg confirms it.
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 1
  MaxTime = 6
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  TrackGhosts = FALSE
  USReading = "fetch"

INIT Init
NEXT Next

INVARIANTS
  TypeOK
  NoTimelyExpiry
  NegativeEndsAreTrue
  ExpiryAfterB
  LatchIsTrue
  OneLive
  AllocatedPrefix
  PastAttemptsEnded
  CompleteIffShipped
  NoSilentEnd
  NeverBetweenAttempts
  RefusedOnlyWhenExhausted
  USAfterB
  P5_UnavailablePeriod

PROPERTIES
  EndedFrozen
  LatchProtects
  ShipFromLatch
  TerminalLatched

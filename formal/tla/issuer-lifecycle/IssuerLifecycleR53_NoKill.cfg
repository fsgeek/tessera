\* R5.3 ILC3-01: residual (a) with Kill DISABLED (AllowKill = FALSE): a timely
\* observation lost through a dropped or guard-failed latch. Two polls per tick;
\* MaxFaults 1 is then spent only on Drop or Resend. VIOLATED = reachable.
CONSTANTS
  N = 1
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 5
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  MaxPollsPerTick = 2
  TrackGhosts = TRUE
  WindowMode = "completed"
  AllowKill = FALSE

INIT Init
NEXT Next

INVARIANTS
  ResidualLostLatchNoKill

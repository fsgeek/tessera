\* R5 residual witnesses on the CORRECT model, plus the literal P5 form.
\* NOT checked properties: a violation means the path is REACHABLE. Run with
\* run-witnesses-r5.sh (one BFS run per witness; shortest trace).
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 1
  MaxTime = 6
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  TrackGhosts = TRUE
  USReading = "fetch"

INIT Init
NEXT Next

INVARIANTS
  ResidualKilledObserver
  ResidualUnobserved
  ResidualLiveObserver
  P5_Literal

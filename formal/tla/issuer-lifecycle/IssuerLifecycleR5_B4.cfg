\* R5 companion B4: EVIDENCE_UNAVAILABLE after a single failed poll (the
\* revision-4 rule: now > B + OpPeriod and this poll did not succeed; no
\* unavailable_since, no re-fetch). EXPECTED: RED on P5_UnavailablePeriod.
\* Only the target invariant is checked. Constants as IssuerLifecycleR5.cfg.
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 1
  MaxTime = 6
  MaxFaults = 1
  Variant = "B4"
  PollEachTick = FALSE
  TrackGhosts = FALSE
  USReading = "fetch"

INIT Init
NEXT Next

INVARIANTS
  P5_UnavailablePeriod

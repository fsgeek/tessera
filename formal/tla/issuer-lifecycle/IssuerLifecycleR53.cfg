\* R5.3 main safety. Expected GREEN: P1-P3, USAfterB, P5 (interval membership,
\* completed window). N = 2, MaxTime 6, one poll per tick, MaxFaults 1, OpPeriod 2,
\* PollInterval 1 (Expected 2), Allowance 0, WindowMode "completed".
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 6
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  MaxPollsPerTick = 1
  TrackGhosts = FALSE
  WindowMode = "completed"
  AllowKill = TRUE

INIT Init
NEXT Next

INVARIANTS
  TypeOK
  NoTimelyExpiry
  NegativeEndsAreTrue
  ExpiryAfterB
  LatchIsTrue
  OneLive
  AllocatedPrefix
  PastAttemptsEnded
  CompleteIffShipped
  NoSilentEnd
  NeverBetweenAttempts
  RefusedOnlyWhenExhausted
  USAfterB
  P5_UnavailablePeriod

PROPERTIES
  EndedFrozen
  LatchProtects
  ShipFromLatch
  TerminalLatched

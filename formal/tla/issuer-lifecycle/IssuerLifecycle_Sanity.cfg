\* Vacuity witnesses for the revision-4 model. Run with -continue -deadlock,
\* piping through scripts/filter-tlc-output.sh. VIOLATING every invariant
\* listed is the healthy result: each named path (ship, ship on attempt 2,
\* refusal, expiry, discard, EVIDENCE_UNAVAILABLE, latch after B, a latch
\* after a partial-header fetch (the lower attestation qualifying later), an
\* orphaned in-flight write, observation-to-send delay, commit after send, a
\* resolved duplicate, a timely burial first observed after B and still
\* latched) is reachable, so the main cfg's invariants are not vacuous.
\* ORDER: specific before broad (TLC reports the first failing per state).
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 1
  MaxTime = 7
  MaxFaults = 2
  Variant = "correct"
  PollEachTick = FALSE
  TrackGhosts = TRUE

INIT Init
NEXT Next

INVARIANTS
  TimelyUnobservedLatchUnreachable
  PartialThenLatchUnreachable
  LateLatchUnreachable
  SecondAttemptShipUnreachable
  DuplicateUnreachable
  OrphanPendingUnreachable
  SendDelayUnreachable
  CommitDelayUnreachable
  ExpiredUnreachable
  DiscardedUnreachable
  UnavailUnreachable
  ShipUnreachable
  RefusalUnreachable

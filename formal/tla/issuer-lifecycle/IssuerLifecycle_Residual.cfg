\* NON-CHECKED WITNESSES of the stated residual and its siblings, on the
\* CORRECT model (Variant = "correct"). Run with -continue -deadlock, piping
\* through scripts/filter-tlc-output.sh. A VIOLATION means the path is
\* REACHABLE: a timely-eligible attempt (registered burialAtWall definition)
\* ended EVIDENCE_UNAVAILABLE —
\*   ResidualKilledObserver: after an on-time observation whose invocation
\*     was killed before sending its latch (the design's named residual);
\*   ResidualUnobserved: with no observation at all (ILC2-01's path);
\*   ResidualLiveObserver: although a never-killed invocation sent a latch
\*     write, because a killed predecessor's delayed EVIDENCE_UNAVAILABLE
\*     write committed first.
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 1
  MaxTime = 7
  MaxFaults = 2
  Variant = "correct"
  PollEachTick = FALSE
  TrackGhosts = TRUE

INIT Init
NEXT Next

INVARIANTS
  ResidualKilledObserver
  ResidualLiveObserver
  ResidualUnobserved

\* R5.3 residuals (a) and (b), CORRECT model, two polls per tick; run with
\* run-witnesses-r53.sh. VIOLATED = reachable. N = 1, MaxTime 5.
CONSTANTS
  N = 1
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 5
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  MaxPollsPerTick = 2
  TrackGhosts = TRUE
  WindowMode = "completed"
  AllowKill = TRUE

INIT Init
NEXT Next

INVARIANTS
  ResidualKilledObserver
  ResidualUnobserved

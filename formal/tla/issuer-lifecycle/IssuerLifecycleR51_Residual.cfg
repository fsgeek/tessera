\* R5.1 residual witnesses, CORRECT model, one poll per time unit. Run with
\* run-witnesses-r51.sh. VIOLATED = reachable; NOT violated after the run
\* completes = unreachable at these bounds (exhaustive with ghosts on).
\* N = 1, MaxTime = 5 (B = 1; failed polls 2, 3; end decided at 4; leftover
\* writes resolvable until 5), MaxFaults = 1.
CONSTANTS
  N = 1
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 5
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  MaxPollsPerTick = 1
  TrackGhosts = TRUE

INIT Init
NEXT Next

INVARIANTS
  ResidualKilledObserver
  ResidualUnobserved
  ResidualLiveObserver

\* R5.2 (1)+(2): the 2-polls-per-tick case that turned R51 P5_Spread red.
\* EXPECTED GREEN: no attempt ends EVIDENCE_UNAVAILABLE with an interval of the
\* period lacking a failed fetch (the 2,4,4 / 3,5,5 burst traces). Exhaustive.
\* Bounds: N = 1, MaxTime = 6, 2 polls/tick, MaxFaults 1, OpPeriod 2,
\* PollInterval 1 (Expected 2), Allowance 0, B = declared + 1.
CONSTANTS
  N = 1
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 6
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  MaxPollsPerTick = 2
  TrackGhosts = FALSE

INIT Init
NEXT Next

INVARIANTS
  P5_UnavailablePeriod
  P5_Spread
  NoTimelyExpiry
  USAfterB

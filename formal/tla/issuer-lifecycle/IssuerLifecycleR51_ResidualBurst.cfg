\* As IssuerLifecycleR51_Residual.cfg but up to 2 polls per time unit (bursts):
\* what (a) and (b) need when polls can bunch up.
CONSTANTS
  N = 1
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 5
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  MaxPollsPerTick = 2
  TrackGhosts = TRUE

INIT Init
NEXT Next

INVARIANTS
  ResidualKilledObserver
  ResidualUnobserved

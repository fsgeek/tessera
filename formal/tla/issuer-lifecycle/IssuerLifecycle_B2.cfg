\* Broken companion B2 — a second concurrent writer (the API lifecycle writer of revision 2) running
\* the same decision procedure with the same (state, attempt id) guards.
\* Designed against NoTimelyExpiry. PREDICTION RECORDED BEFORE THE RUN: GREEN
\* (revision 4's safety does not rest on one writer); see RESULTS.md.
\* Constants identical to IssuerLifecycle.cfg except Variant and MaxFaults = 0:
\* with two concurrent writers the fault budget is not needed to overlap
\* writes (both processes overlap directly), and MaxFaults = 2 does not finish
\* in minutes (> 15M distinct states and growing at 3 min).
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 1
  MaxTime = 7
  MaxFaults = 0
  Variant = "B2"
  PollEachTick = FALSE
  TrackGhosts = FALSE

INIT Init
NEXT Next

INVARIANTS
  NoTimelyExpiry
  TypeOK
  NegativeEndsAreTrue
  ExpiryAfterB
  LatchIsTrue
  OneLive
  AllocatedPrefix
  PastAttemptsEnded
  CompleteIffShipped
  NoSilentEnd
  NeverBetweenAttempts
  RefusedOnlyWhenExhausted

PROPERTIES
  EndedFrozen
  LatchProtects
  ShipFromLatch
  TerminalLatched

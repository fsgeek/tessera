\* R5.1 with bursts: up to 2 poller starts per time unit (redelivery, async
\* retry). Otherwise as IssuerLifecycleR51.cfg. Checks P5 and P5_Spread.
\* Result in RESULTS.md section 6.
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 6
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = FALSE
  MaxPollsPerTick = 2
  TrackGhosts = FALSE

INIT Init
NEXT Next

INVARIANTS
  P5_UnavailablePeriod
  P5_Spread

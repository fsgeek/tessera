\* Control for P4 (expected RED on Termination): identical to
\* IssuerLifecycle_Live.cfg except OpPeriod = 20 > MaxTime, so step 5's
\* EVIDENCE_UNAVAILABLE end can never fire in the bounded run. Shows that
\* termination rests on step 5 (with no fairness on evidence, an attempt
\* whose evidence never completes otherwise stays open forever), and that
\* the green _Live run is not vacuous.
CONSTANTS
  N = 2
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 20
  MaxTime = 11
  MaxFaults = 1
  Variant = "correct"
  PollEachTick = TRUE
  TrackGhosts = FALSE

SPECIFICATION LiveSpec

PROPERTIES
  Termination

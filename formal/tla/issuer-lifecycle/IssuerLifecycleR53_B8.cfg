\* R5.3 ILC3-03 companion B8: the R52 FIXED window. FixedWindowStranded VIOLATED
\* = a state reached in which a fixed-window interval passed with no committed
\* failure (no end is possible thereafter without a committed success).
\* EndAfterGapUnreachable NOT violated = such an attempt never ends. Bounds as _Roll.
CONSTANTS
  N = 1
  Delta = 0
  Slack = 1
  Lease = 1
  Timeout = 1
  OpPeriod = 2
  PollInterval = 1
  Allowance = 0
  MaxTime = 6
  MaxFaults = 0
  Variant = "B8"
  PollEachTick = FALSE
  MaxPollsPerTick = 1
  TrackGhosts = FALSE
  WindowMode = "completed"
  AllowKill = TRUE

INIT Init
NEXT Next

INVARIANTS
  FixedWindowStranded

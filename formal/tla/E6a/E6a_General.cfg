\* E6a main configuration, GENERAL (Band 0 P4) instance (STATUS: PROPOSED, 2026-10-19, AI
\* collaborator). Two signature slots (V1's kms and gpg), two required
\* evidence members, one of them (git) waivable under a degraded policy
\* (A1.2.1, P10; not a V1 configuration). Used for the correct module (must be GREEN) and, as the
\* all-invariants run, for every _Broken companion (must be RED).
